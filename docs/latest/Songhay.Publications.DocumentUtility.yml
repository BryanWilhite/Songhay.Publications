  assemblies:
  - Songhay.Publications
  namespace: Songhay.Publications
  summary: >-
    Returns a tuple of two <xref href="System.Text.Json.JsonElement" data-throw-if-not-resolved="false"></xref> instances

    representing the conventional tags and properties elements.
  remarks: >-
    The <xref href="System.Text.Json.Nodes.JsonObject" data-throw-if-not-resolved="false"></xref> passed into this method

    should be or will be shaped like <xref href="Songhay.Publications.Abstractions.IDocument" data-throw-if-not-resolved="false"></xref>

    where <xref href="Songhay.Publications.Abstractions.IDocument.Tag" data-throw-if-not-resolved="false"></xref> can be serialized JSON

    of the form:


    <pre><code class="lang-csharp">{
        \"tags\": [...],
        \"properties\": { ... }
    }</code></pre>


    ...where the <code>tags</code> property is an array of strings

    and the <code>properties</code> property is an object

    of conventional properties, named with a prefix of <code>rx</code>.


    This use of <xref href="Songhay.Publications.Abstractions.IDocument.Tag" data-throw-if-not-resolved="false"></xref> is a temporary workaround

    until a formal concept of Document properties can be defined.
