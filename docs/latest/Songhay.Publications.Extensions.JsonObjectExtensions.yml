  namespace: Songhay.Publications.Extensions
  summary: >-
    Returns a serialized JSON string,

    according to the conventions

    for <xref href="Songhay.Publications.Abstractions.IDocument.Tag" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>

    This member expects to see a <xref href="System.Text.Json.Nodes.JsonObject" data-throw-if-not-resolved="false"></xref>

    with several properties with names prefixed with <code>rx</code>

    and a <code>tags</code> property.

    </p>


    <p>

    This implies that the <xref href="System.Text.Json.Nodes.JsonObject" data-throw-if-not-resolved="false"></xref> is generated

    from a Markdown file and this member is being used to save

    into a Publications database.

    </p>
